# audio_config.yaml
# PS26052 — Phase 5 Live Pipeline Audio Configuration
# Edit this file to match the physical hardware at demo time.
# All units are SI unless noted.

audio:
  # Sample rate used by DeepFilterNet. Must NOT be changed without re-testing.
  sample_rate: 48000

  # Number of audio channels on the physical I/O device.
  # 1 = mono (USB mic / TRRS), 2 = stereo (line-in or USB audio interface).
  channels: 1

  # Processing chunk duration in seconds.
  # Smaller = lower latency, higher CPU. Keep >= 0.05 on Pi.
  # DFN3 expects at least 1 frame (10 ms). 0.1 s is a safe starting value.
  chunk_duration_sec: 0.1

  # Derived — do not edit; the code computes these at startup.
  # chunk_samples = sample_rate * chunk_duration_sec  → 4800 @ 48 kHz / 0.1 s
  # hop_samples = chunk_samples (non-overlapping ring buffer design)

  # Ring buffer duration in seconds.
  # Must be >= chunk_duration_sec * 4 to avoid wrap-around drops under transient load.
  ring_buffer_duration_sec: 2.0

  # I/O device selection.
  # Set to null to use the system default device (dev machine).
  # On Raspberry Pi 5 with snd-aloop loaded:
  #   run `python live/main.py detect` or `arecord -l` to confirm card numbers.
  #   Both subdevices of card 2 (hw:2,0 and hw:2,1) support 32ch in+out.
  #   Use index 0 for both (Loopback PCM hw:2,0) as a single full-duplex loopback.
  # For a physical USB mic + headphones, set to the appropriate indices.
  input_device: 0
  output_device: 0

model:
  # DeepFilterNet model variant. Only "DeepFilterNet3" is validated.
  variant: "DeepFilterNet3"

  # Attenuation limit passed to df.enhance().
  # Range: 0–100 dB. 100 = full suppression, 0 = bypass.
  atten_lim_db: 100

  # Post-enhancement gain correction (linear, applied after enhance()).
  # Use 1.0 unless there is a measured level mismatch.
  output_gain: 1.0

pipeline:
  # Operating mode:
  #   "enhance"  — run DeepFilterNet on every chunk (default)
  #   "bypass"   — pass audio through without processing (for latency baseline)
  mode: "enhance"

  # Enable chunk-level timing logs to stderr (useful for latency profiling).
  log_timing: false

  # Maximum allowable end-to-end latency before a warning is logged (seconds).
  latency_warn_sec: 0.30

  # Number of warmup inference passes on startup (prevent first-chunk jitter).
  warmup_passes: 3

  # Number of silence chunks pre-loaded into the output ring buffer at
  # startup so the output callback doesn't underrun before the first real
  # chunk is enhanced. THIS IS PERMANENT STANDING LATENCY, not one-time
  # warmup cost -- it never drains (FIFO). priming_chunks * chunk_duration_sec
  # is added to every measurement of end-to-end latency.
  # Was hardcoded to 3 (= 300 ms @ 100 ms chunks) -- changed to 1 (2026-08-24)
  # based on measured p95 inference latency (39 ms against a 100 ms chunk
  # budget, i.e. ~61 ms of slack per chunk -- comfortably covered by 1 chunk
  # of priming). Re-validate with `python live/main.py stress` (0 dropouts
  # required) after changing this or chunk_duration_sec.
  priming_chunks: 1
